<main class="main collections-main">
    <div class="collections-top" style="background-image: image-set(
        url('images/collections-bg.avif') type('image/avif'),
        url('images/collections-bg.webp') type('image/webp'),
        url('images/collections-bg.jpg')
    );">
    </div>
    <!--=include breadcrumbs.html  -->
    <section class="collections">
        <div class="container">
            <h2 class="collections__title">
                COLLECTION
            </h2>
            <div class="collections__inner">
                <div class="collections__item">
                    <picture>
                        <source srcset="collections-1.avif" type="image/avif">
                        <source srcset="collections-1.webp" type="image/webp">
                        <img src="collections-1.png" alt="Alt text">
                    </picture>
                    <button class="collections__like">
                        <svg width="24" height="21">
                            <use xlink:href="images/sprite.svg#heart"></use>
                        </svg>
                    </button>
                    <p class="collections__item-text">ICONIC</p>
                </div>
            </div>
        </div>
    </section>
</main>
<!--=include footer.html  -->
