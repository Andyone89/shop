<section class="join-us">
    <div class="container">
        <div class="join-us__inner">
            <picture >
                <source srcset="images/join-img.avif" type="image/avif">
                <source srcset="images/join-img.webp" type="image/webp">
                <img class="join-us__img" src="images/join-img.jpg" alt="Join Us">
            </picture>
            <div class="join-us__box">
                <h2 class="join-us__title">
                    Join us
                </h2>
                <p class="join-us__text">
                    Sign up and get 10% discount on your first purchase!
                </p>
                <form action="" class="join-us__form">
                    <input class="join-us__input" type="text" placeholder="First Name">
                    <input class="join-us__input" type="text" placeholder="Email">
                    <button class="join-us__btn" type="submit">GET 10%</button>
                    <p class="join-us__form-caption">*By compleating this form you are signing up to receive our emails
                        and can unsubscribe at any time.</p>
                </form>
            </div>
        </div>
    </div>
</section>
